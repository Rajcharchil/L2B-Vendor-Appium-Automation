# Compile-only gate — no emulator/Appium. Does not claim UI test results.
name: Compile check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test-compile
        run: mvn -B -DskipTests test-compile
